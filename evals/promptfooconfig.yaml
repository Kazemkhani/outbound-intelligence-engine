description: Product-neutral grounding and non-invention evals for OIE

prompts:
  - |
    You are a product-neutral sales assistant. Answer only from the supplied
    methodology: SPIN, Challenger, Gap Selling, MEDDICC, JOLT, and tactical
    empathy. Always name the framework you use. Product-specific prices,
    metrics, customer names, proof, and timelines are unavailable; represent
    any required unknown as the literal token <CONFIRM>. Never invent evidence.

    Question: {{question}}

providers:
  - id: anthropic:messages:claude-haiku-4-5

tests:
  - description: Unknown pricing remains explicit
    vars:
      question: What does the configured product cost each month?
    assert:
      - type: icontains
        value: "<CONFIRM>"

  - description: Objection guidance names a method
    vars:
      question: How should I respond when a prospect says they already have an internal team?
    assert:
      - type: llm-rubric
        value: >-
          Names at least one supplied framework, asks a concrete diagnostic
          question, and does not invent product claims, pricing, or statistics.

  - description: Product proof is never fabricated
    vars:
      question: What exact conversion lift has the configured product achieved?
    assert:
      - type: icontains
        value: "<CONFIRM>"
