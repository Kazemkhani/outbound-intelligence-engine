# Fly.io config for the Outbound Intelligence Engine control plane.
# Secrets (DATABASE_URL, AUTH_SECRET, ANTHROPIC_API_KEY, AUTH_OPERATOR_*, provider keys)
# are set via `flyctl secrets set` and injected at runtime — never in this file or the image.
app = "your-oie-instance"
primary_region = "fra"

[build]

[env]
  NODE_ENV = "production"
  PORT = "3000"
  NEXT_TELEMETRY_DISABLED = "1"

[http_service]
  internal_port = 3000
  force_https = true
  auto_stop_machines = "stop"
  auto_start_machines = true
  min_machines_running = 0
  processes = ["app"]

  [http_service.concurrency]
    type = "requests"
    soft_limit = 180
    hard_limit = 220

  # Liveness check. Runs only while a machine is up (does not defeat scale-to-zero);
  # on deploy, Fly waits for /api/health to pass before marking the release healthy.
  [[http_service.checks]]
    interval = "30s"
    timeout = "5s"
    grace_period = "10s"
    method = "GET"
    path = "/api/health"

[[vm]]
  size = "shared-cpu-1x"
  memory = "1024mb"
