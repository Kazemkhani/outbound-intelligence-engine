name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      DATABASE_URL: postgresql://oie:oie@localhost:5432/oie?schema=public
      AUTH_SECRET: ci-only-not-a-secret-0123456789
      DRY_RUN: "true"
      NODE_ENV: test
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: oie
          POSTGRES_PASSWORD: oie
          POSTGRES_DB: oie
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U oie -d oie"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # pnpm version is read from the "packageManager" field in package.json.
      - uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6.0.10

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Generate Prisma client
        run: pnpm db:generate

      - name: Apply migrations
        run: pnpm --filter @oie/db migrate:deploy

      - name: Verify (typecheck + lint + test + build)
        run: pnpm verify

      - name: Seed (smoke)
        run: pnpm db:seed
