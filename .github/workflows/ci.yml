name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    env:
      DATABASE_URL: postgresql://oie:oie@localhost:5432/oie?schema=public
      AUTH_SECRET: ci-only-not-a-secret-0123456789
      DRY_RUN: "true"
      NODE_ENV: test
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: oie
          POSTGRES_PASSWORD: oie
          POSTGRES_DB: oie
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U oie -d oie"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 10

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Generate Prisma client
        run: pnpm db:generate

      - name: Apply migrations
        run: pnpm --filter @oie/db migrate:deploy

      - name: Verify (typecheck + lint + test + build)
        run: pnpm verify

      - name: Seed (smoke)
        run: pnpm db:seed
