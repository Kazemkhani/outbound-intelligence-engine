name: secret-scan

# Detective control (SOC 2 CC7.2): scan every push/PR — and the full history —
# for committed secrets. Secrets live only in .env (gitignored); this is the
# automated backstop that fails the build if one ever slips in.

on:
  push:
  pull_request:
  schedule:
    - cron: "0 3 * * 1" # weekly full-history sweep (Mondays 03:00 UTC)

permissions:
  contents: read
  pull-requests: read # gitleaks-action lists PR commits via the API on pull_request events

jobs:
  gitleaks:
    name: gitleaks
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0 # full history so the scan covers all commits
          persist-credentials: false
      - name: Run gitleaks
        uses: gitleaks/gitleaks-action@e0c47f4f8be36e29cdc102c57e68cb5cbf0e8d1e # v3.0.0
        env:
          # gitleaks-action requires the token to fetch PR commits; without it
          # the action errors out on pull_request events instead of scanning.
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
